<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Victor App{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>

<body>

<header>
    <h1>Victor App</h1>
    <nav>
        <a href="{{ url_for('main.home') }}">🏠 Home</a>
        <a href="#" onclick="loadPage('son')">🎵 Son</a>
        <a href="#" onclick="loadPage('tchat')">💬 Tchat</a>
        <a href="{{ url_for('main.logout') }}">🚪 Logout</a>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
