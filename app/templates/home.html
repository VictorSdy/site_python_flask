<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accueil - Victor App</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/news.css') }}">
    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>

<body>

<header>
    <h1>Bienvenue sur la Home Page de Victor 👋</h1>
</header>

<div class="container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="menu">
            <div class="card" onclick="loadPage('newsbe')">📰 News Belgique</div>
            <div class="card" onclick="loadPage('newsfr')">🇫🇷 News France</div>
            <div class="card" onclick="loadPage('tchat')">💬 Tchat en direct</div>
            <div class="card" onclick="loadPage('son')">🎵 Écouter un son</div>
        </div>
        <div class="logout">
            <a href="{{ url_for('main.logout') }}">🚪 Se déconnecter</a>
        </div>
    </aside>

    <!-- CONTENU DYNAMIQUE -->
    <main id="content-box">
        <p class="placeholder">👈 Clique sur une activité pour afficher le contenu ici</p>
    </main>
</div>

<footer>
    © 2025 Victor App — Propulsé par Flask ⚡
</footer>

</body>
</html>
